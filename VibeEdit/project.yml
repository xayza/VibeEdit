name: VibeEdit
options:
  minimumXcodeGenVersion: "2.46.0"
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
configFiles:
  Debug: Configs/Debug.xcconfig
  Release: Configs/Release.xcconfig
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.20.0
  ArgumentParser:
    url: https://github.com/apple/swift-argument-parser
    from: 1.5.0
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.17.0
  Collections:
    url: https://github.com/apple/swift-collections
    from: 1.1.4
  MCPSwiftSDK:
    url: https://github.com/modelcontextprotocol/swift-sdk.git
    exactVersion: 0.12.1
  VibeEditCore:
    path: Packages/VibeEditCore
  # The root Package.swift is the single source of targets; Xcode links its library products.
  VibeEdit:
    path: .
targets:
  # The target name must differ from "VibeEdit" beyond case: on a case-insensitive disk both targets
  # would share one intermediates folder and leak compiler flags into each other.
  VibeEditCLI:
    type: tool
    platform: macOS
    sources: [CLI]
    settings:
      base:
        PRODUCT_NAME: vibeedit
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: VibeEdit/Helper.entitlements
    dependencies:
      - package: VibeEdit
        product: VibeEditAutomation
      - package: VibeEditCore
        product: VibeEditProject
      - package: ArgumentParser
        product: ArgumentParser
  VibeEditMCP:
    type: tool
    platform: macOS
    sources: [MCPBridge]
    settings:
      base:
        PRODUCT_NAME: vibeedit-mcp
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: VibeEdit/Helper.entitlements
    dependencies:
      - package: VibeEdit
        product: VibeEditAutomation
      - package: MCPSwiftSDK
        product: MCP
  # Core plugin: the provider executable of Plugins/audio-analysis (bin/vibeedit-audio-analysis, its plugin.json
  # entrypoint; each core plugin's executable has its own name, or an archive fails on two products named alike),
  # embedded in Contents/Resources/Plugins
  # (Contents/PlugIns is for code bundles; codesign rejects a plain plugin folder there).
  AudioAnalysisProvider:
    type: tool
    platform: macOS
    sources: [Plugins/audio-analysis/Sources/Provider]
    settings:
      base:
        PRODUCT_NAME: vibeedit-audio-analysis
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: VibeEdit/Helper.entitlements
    dependencies:
      - package: VibeEdit
        product: VibeEditAudioAnalysis
  # Core plugin: the provider executable of Plugins/vision (Apple Vision faces, people and text).
  VisionProvider:
    type: tool
    platform: macOS
    sources: [Plugins/vision/Sources/Provider]
    settings:
      base:
        PRODUCT_NAME: vibeedit-vision
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: VibeEdit/Helper.entitlements
    dependencies:
      - package: VibeEdit
        product: VibeEditVisionAnalysis
  VibeEdit:
    type: application
    platform: macOS
    sources:
      - path: VibeEdit
        excludes: [Core/Engine, Core/Storage, Core/Agent, Core/Automation, Core/Plugins, Core/Services, Info.plist, VibeEdit.entitlements, Resources/en.lproj, Resources/vi.lproj]
      - path: VibeEdit/Resources/en.lproj/InfoPlist.strings
        buildPhase: resources
      - path: VibeEdit/Resources/vi.lproj/InfoPlist.strings
        buildPhase: resources
      - path: Plugins/audio-analysis/plugin.json
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Plugins/vibeedit.audio-analysis
      - path: Plugins/vision/plugin.json
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Plugins/vibeedit.vision
    # The agent kit from a sibling checkout ($VIBEEDIT_AGENT_KIT); without one the app downloads kit releases.
    postCompileScripts:
      - name: Bundle the agent kit
        basedOnDependencyAnalysis: false
        script: scripts/bundle-agent-kit.sh "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/AgentKit"
    info:
      path: VibeEdit/Info.plist
      properties:
        CFBundleExecutable: VibeEditApp
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        LSApplicationCategoryType: public.app-category.video
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        NSMicrophoneUsageDescription: VibeEdit records voiceover directly into the current project.
        # Help menu and About panel links (MainMenu); an empty value hides the item.
        BCRepositoryURL: https://github.com/dongnguyenvie/BashCut
        BCIssuesURL: https://github.com/dongnguyenvie/BashCut/issues
        BCContactEmail: dongnguyenvie@gmail.com
        # YES in the Debug configuration (Configs/Debug.xcconfig): a build from Xcode is not a release, so it does not
        # look for updates by itself. scripts/run.sh sets it too.
        BCDevelopmentBuild: $(BC_DEVELOPMENT_BUILD)
        # Finder "Open With" and Dock drops for project.vibeedit.json or a project folder; never the default for JSON.
        CFBundleDocumentTypes:
          - CFBundleTypeName: VibeEdit Project
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.json, public.folder]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vibeedit
        EXECUTABLE_NAME: VibeEditApp
        CODE_SIGN_ENTITLEMENTS: VibeEdit/VibeEdit.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: SwiftTerm
        product: SwiftTerm
      - target: VibeEditCLI
        embed: true
        codeSign: true
        copy:
          destination: executables
      - target: VibeEditMCP
        embed: true
        codeSign: true
        copy:
          destination: executables
      - target: AudioAnalysisProvider
        embed: true
        codeSign: true
        copy:
          destination: resources
          subpath: Plugins/vibeedit.audio-analysis/bin
      - target: VisionProvider
        embed: true
        codeSign: true
        copy:
          destination: resources
          subpath: Plugins/vibeedit.vision/bin
      - package: VibeEdit
        product: VibeEditEngine
      - package: VibeEdit
        product: VibeEditStorage
      - package: VibeEdit
        product: VibeEditAgent
      - package: VibeEdit
        product: VibeEditAutomation
      - package: VibeEdit
        product: VibeEditPlugins
      - package: VibeEdit
        product: VibeEditDocument
      - package: VibeEditCore
        product: VibeEditProject
      - package: VibeEditCore
        product: VibeEditImport
      - package: VibeEditCore
        product: VibeEditInterchange
      # Plugin types appear in app code directly; static products are not re-exported by frameworks.
      - package: VibeEditCore
        product: VibeEditPlugin
      # VibeEditProject's public history API exposes Deque, so the app links it directly in Xcode.
      - package: Collections
        product: DequeModule
  # Runs every per-module test folder from Package.swift in one Xcode bundle.
  VibeEditTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes: [VibeEditTestSupport, "**/__Snapshots__"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: VibeEdit
        product: VibeEditAudioAnalysis
      - package: VibeEdit
        product: VibeEditEngine
      - package: VibeEdit
        product: VibeEditStorage
      - package: VibeEdit
        product: VibeEditAgent
      - package: VibeEdit
        product: VibeEditAutomation
      - package: VibeEdit
        product: VibeEditPlugins
      - package: VibeEdit
        product: VibeEditDocument
      - package: VibeEdit
        product: VibeEditTestSupport
      - package: VibeEditCore
        product: VibeEditProject
      - package: VibeEditCore
        product: VibeEditPlugin
      - package: VibeEditCore
        product: VibeEditInterchange
      - package: Collections
        product: DequeModule
      - package: SnapshotTesting
        product: SnapshotTesting
schemes:
  VibeEdit:
    build:
      targets:
        VibeEdit: all
    test:
      targets: [VibeEditTests]
